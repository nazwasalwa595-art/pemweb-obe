<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daftar akun AbsensiQR">
  <title>Daftar Akun - AbsensiQR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#main">Lewati ke konten utama</a>
    <p><strong>AbsensiQR</strong></p>
    <nav aria-label="Navigasi Utama">
      <a href="index.html">Beranda</a>
      <a href="login.html">Masuk</a>
      <a href="register.html">Daftar</a>
    </nav>
  </header>

  <main id="main">
    <section class="auth-container">
      <article class="auth-info">
        <h1>Buat Akun AbsensiQR</h1>
        <p>Pilih peran Anda dan daftarkan NIM/NIP resmi Anda.</p>
        <figure>
          <img src="Ilustrasi_qr_code.png" alt="Ilustrasi pendaftaran akun AbsensiQR" width="180">
        </figure>
      </article>

      <article class="auth-form-box">
        <p id="form-summary" role="alert"></p>
        <form id="form-register" class="form-stack" action="#" method="POST" novalidate>
          <p>
            <label for="peran">Daftar Sebagai *</label>
            <select id="peran" name="peran" required>
              <option value="Siswa/Mahasiswa">Siswa / Mahasiswa</option>
              <option value="Guru/Dosen">Guru / Dosen</option>
            </select>
          </p>
          <p>
            <label for="username">Username (NIM / NIS / NPM / NIP / NIDN) *</label>
            <input id="username" name="username" type="text" inputmode="numeric" maxlength="18"
                   autocomplete="username" placeholder="Angka saja, 8–18 digit" required>
          </p>
          <p>
            <label for="nama">Nama Lengkap *</label>
            <input id="nama" name="nama" type="text" maxlength="100" autocomplete="name" placeholder="Nama lengkap Anda" required>
          </p>
          <p>
            <label for="email">Alamat Email *</label>
            <input id="email" name="email" type="email" maxlength="150" autocomplete="email" placeholder="nama@email.com" required>
          </p>
          <p>
            <label for="password">Kata Sandi * (minimal 8 karakter)</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Buat kata sandi" required>
          </p>
          <button type="submit" class="btn-primary">Daftar Akun</button>
        </form>
        <p class="auth-link">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AbsensiQR. All rights reserved.</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
