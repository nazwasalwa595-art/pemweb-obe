<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun - AbsensiQR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="#main" class="skip-link">Lewati ke konten utama</a>
    <img src="logo_absensiqr.png" alt="Logo AbsensiQR" width="90">
    <h1>Absensi<span>QR</span></h1>
    <nav aria-label="Navigasi Utama">
      <a href="index.html">Beranda</a>
      <a href="login.html">Masuk</a>
      <a href="register.html" class="nav-btn-login">Daftar</a>
    </nav>
  </header>

  <main id="main">
    <section class="auth-container">
      
      <article class="auth-info">
        <h2>Buat Akun AbsensiQR</h2>
        <p>Pilih peran Anda dan daftarkan NIP/NIM resmi Anda.</p>
        <figure>
          <img src="Kirimsaran.png" alt="Ilustrasi Pendaftaran" width="180">
        </figure>
      </article>

      <article class="auth-form-box">
        <form id="form-register" action="#" method="POST" novalidate>
          <p>
            <label for="peran">Daftar Sebagai *</label>
            <select id="peran" name="peran" required>
              <option value="Siswa/Mahasiswa">Siswa / Mahasiswa</option>
              <option value="Guru/Dosen">Guru / Dosen</option>
            </select>
          </p>

          <p>
            <label for="username">Username (NIM / NIP) *</label>
            <input id="username" name="username" type="text" placeholder="Masukkan NIM atau NIP" required>
          </p>

          <p>
            <label for="nama">Nama Lengkap *</label>
            <input id="nama" name="nama" type="text" placeholder="Nama Lengkap Anda" required>
          </p>

          <p>
            <label for="email">Alamat Email *</label>
            <input id="email" name="email" type="email" placeholder="nama@email.com" required>
          </p>

          <p>
            <label for="password">Kata Sandi *</label>
            <input id="password" name="password" type="password" placeholder="Buat kata sandi aman" required>
          </p>

          <button type="submit" class="btn-primary">Daftar Akun</button>
        </form>

        <p class="auth-link">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>
      </article>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 AbsensiQR. All rights reserved.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
